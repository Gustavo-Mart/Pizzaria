<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Administrador</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='font.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='pizza.ico') }}" type="image/x-icon">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>

<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <i data-lucide="shield-check"></i>
        <h1>Login Admin</h1>
        <p>Acesso ao Painel Administrativo</p>
      </div>

      <form class="login-form" method="POST">
        <div class="form-group">
          <label for="email">
            <i data-lucide="mail"></i>
            Email de Administrador
          </label>
          <input type="email" id="email" name="email" placeholder="Digite seu email" required autofocus>
          <label for="senha">
            <i data-lucide="lock"></i>
            Senha de Administrador
          </label>
          <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
        </div>

        <button type="submit" class="btn-login">
          <i data-lucide="log-in"></i>
          Entrar
        </button>
      </form>

      <div class="login-footer">
        <a href="{{ url_for('index') }}" class="back-link">
          <i data-lucide="arrow-left"></i>
          Voltar ao Cardápio
        </a>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>

</html>
